name: Check Supabase function
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/engine.ts'
      - 'src/cloud-policy.ts'
      - '.github/workflows/backend-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-config supabase/functions/tournament/index.ts

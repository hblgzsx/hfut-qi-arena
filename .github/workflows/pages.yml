name: Deploy QI Arena to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Require cloud configuration
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          ALLOW_DEMO_BUILD: ${{ vars.ALLOW_DEMO_BUILD }}
        run: |
          if [ "$ALLOW_DEMO_BUILD" = 'true' ] && [ -z "$SUPABASE_URL" ]; then
            echo '::notice::Publishing explicitly marked LOCAL DEMO. Cross-device scoring requires Supabase.'
            exit 0
          fi
          test -n "$SUPABASE_URL" || { echo 'Configure VITE_SUPABASE_URL repository variable first'; exit 1; }
          test -n "$SUPABASE_KEY" || { echo 'Configure VITE_SUPABASE_PUBLISHABLE_KEY repository variable first'; exit 1; }
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_EVENT_ID: hfut-2026
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
